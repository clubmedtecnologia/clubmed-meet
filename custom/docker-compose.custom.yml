# Override do serviço `web` para a ponte de áudio do paciente (transcrição da
# teleconsulta no prontuário v2 do clubmed-web-2024).
#
# Por que um arquivo à parte, e não editar o docker-compose.yml da raiz: é um
# fork upstream (jitsi/docker-jitsi-meet), sobrescrito a cada atualização.
# Tudo que é customização nossa fica concentrado em `custom/` — este arquivo
# incluído, e não na raiz — para não competir com o que vem do upstream.
#
# O QUE MUDA: só o serviço `web` — troca a imagem publicada (${JITSI_IMAGE_REPO}
# /web:${JITSI_IMAGE_VERSION}, a mesma que o docker-compose.yml já usa) por uma
# camada fina em cima dela (web-transcricao/Dockerfile, ao lado deste arquivo),
# que embute o script e injeta o <script> no index.html. prosody/jicofo/jvb
# continuam intocados. O script vem por COPY no build (versionado neste repo);
# config.js/interface_config.js vêm por bind mount DIRETO do repo (ver
# `volumes` abaixo) — os três customizações saem só de clonar e rodar, sem
# nenhum `cp` manual pro host antes.
#
# config.js/interface_config.js pisam em cima do MESMO caminho que
# ${CONFIG}/web:/config:Z (docker-compose.yml original) já monta — Docker
# aceita bind de arquivo dentro de um diretório já montado; o mount mais
# específico (o arquivo) vence só naquele caminho, o resto do diretório
# continua vindo do host normalmente. Consequência a saber: a partir de agora
# esses dois arquivos são fonte-única-do-repo — editar `$CONFIG/web/config.js`
# direto no host NÃO tem mais efeito, porque o bind do repo sobrepõe.
#
# Uso — ver o passo a passo completo (do zero, servidor novo) em
# `web-transcricao/README.md`. Resumo, com a raiz do repo como diretório atual:
#   docker compose -f docker-compose.yml -f custom/docker-compose.custom.yml up -d --build
#
# Depois de qualquer atualização do Jitsi (JITSI_IMAGE_VERSION mudou no .env)
# OU de qualquer mudança em web-transcricao/transcricao-bridge.js, refaça com
# --build.
#
# Rollback — comportamento de hoje (só a voz do médico), chamada não é afetada:
#   docker compose -f docker-compose.yml up -d web
services:
    web:
        build:
            # ATENÇÃO: o Compose resolve `build.context` relativo ao diretório
            # do PROJETO (onde o comando roda / primeiro -f), não ao diretório
            # deste arquivo — mesmo este .yml estando dentro de custom/, o
            # caminho abaixo é relativo à raiz do repo. Verificado com
            # `docker compose config`; não confie no "achismo" aqui.
            context: ./custom/web-transcricao
            args:
                JITSI_IMAGE_REPO: ${JITSI_IMAGE_REPO:-ghcr.io/jitsi}
                JITSI_IMAGE_VERSION: ${JITSI_IMAGE_VERSION:-unstable}
        image: clubmed/jitsi-web-transcricao:${JITSI_IMAGE_VERSION:-unstable}
        volumes:
            # Caminhos relativos à raiz do projeto, mesma ressalva do
            # `build.context` acima. `:ro` porque o container não tem motivo
            # pra escrever nesses arquivos.
            #
            # Mudou o conteúdo? Só `docker compose restart web` — é bind, não
            # entra na imagem, não precisa de --build (diferente do
            # transcricao-bridge.js, que é COPY).
            - ./custom/config.js:/config/config.js:ro
            - ./custom/interface_config.js:/config/interface_config.js:ro
